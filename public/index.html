<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShrineFlow · 神像 AI 社群小編</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=20260813-15" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="app-header-fixed">
      <div class="topbar">
        <div class="brand-group">
          <span class="brand-badge">✦ SHRINEFLOW <em class="version-tag">v0.1.0</em></span>
          <h1>神像 AI 社群小編</h1>
        </div>
        <div class="status-pill" id="apiStatus">檢查連線中…</div>
      </div>

      <div class="nav-wrapper">
        <nav class="view-tabs" aria-label="工作區分頁">
          <button class="view-tab active" type="button" data-view-target="create"><span>✦</span> 產生文案</button>
          <button class="view-tab" type="button" data-view-target="review"><span>✏️</span> 編輯預覽</button>
          <button class="view-tab" type="button" data-view-target="drafts"><span>📁</span> 草稿</button>
          <button class="view-tab" type="button" data-view-target="schedule"><span>📅</span> 排程</button>
          <button class="view-tab" type="button" data-view-target="settings"><span>⚙️</span> 設定</button>
        </nav>
      </div>
    </header>

    <main class="shell">

      <section class="workspace-grid">

        <!-- ========== 產生文案 ========== -->
        <form class="panel" id="generateForm" data-view-panel="create">
          <div class="panel-heading">
            <div>
              <p class="section-tag">CREATE</p>
              <h2>產生文案</h2>
            </div>
          </div>

          <!-- STEP 1：發布平台與帳號設定 -->
          <fieldset class="form-group-card">
            <legend class="group-title">🚀 1. 發布平台與格式</legend>
            <div class="field-row">
              <div class="field">
                <label for="createChannel" class="field-label">發布平台</label>
                <select id="createChannel" name="channel"></select>
              </div>
              <div class="field">
                <label for="createAccount" class="field-label">發布帳號</label>
                <select id="createAccount" name="accountId"></select>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="createContentType" class="field-label">發布格式</label>
                <select id="createContentType" name="contentType"></select>
              </div>
              <div class="field">
                <label class="field-label">格式說明</label>
                <div id="createContentSettings" class="content-settings"></div>
              </div>
            </div>
          </fieldset>

          <!-- STEP 2：素材與文案內容設定 -->
          <fieldset class="form-group-card">
            <legend class="group-title">📸 2. 素材與文案設定</legend>
            <div class="upload-zone" id="uploadZone">
              <input id="imageInput" name="media" type="file" accept="image/*,video/*" multiple />
              <label for="imageInput" class="upload-prompt">
                <span class="upload-icon">↥</span>
                <strong>拖曳或點擊上傳素材</strong>
                <small>JPG / PNG / MP4（單檔 ≤ 20MB）</small>
              </label>
              <div id="uploadPreviewGallery" class="media-gallery upload-preview-gallery" aria-label="已選擇的媒體"></div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="godName" class="field-label-group">
                  <span class="field-label">神明名稱 <span class="field-required">*</span></span>
                </label>
                <input id="godName" name="godName" type="text" list="godSuggestions" placeholder="例：天上聖母、關聖帝君" autocomplete="off" required />
                <datalist id="godSuggestions"></datalist>
              </div>
              <div class="field">
                <span class="field-label">貼文類型</span>
                <div class="radio-pill-group">
                  <label class="radio-pill">
                    <input type="radio" name="postType" value="work" checked />
                    <span>🎨 作品介紹</span>
                  </label>
                  <label class="radio-pill">
                    <input type="radio" name="postType" value="birthday" />
                    <span>🎂 聖誕祝壽</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="field">
              <label for="extraNotes" class="field-label-group">
                <span class="field-label">補充說明 <span class="field-optional">(選填)</span></span>
              </label>
              <textarea id="extraNotes" name="extraNotes" rows="2" placeholder="例：希望帶到金箔在光影下的典雅質感"></textarea>
            </div>

            <div class="field">
              <label for="defaultHashtags" class="field-label-group">
                <span class="field-label">Hashtag</span>
              </label>
              <input id="defaultHashtags" name="defaultHashtags" type="text" value="#神像彩繪 #宮廟藝術 #傳統工藝 #台灣信仰" />
            </div>
          </fieldset>

          <button class="primary-button" type="submit" id="generateButton"><span>✦</span> AI 產生文案</button>
          <p class="form-hint" id="formMessage"></p>
        </form>

        <!-- ========== 編輯預覽 ========== -->
        <section class="panel is-hidden" data-view-panel="review">
          <div class="panel-heading">
            <div>
              <p class="section-tag">EDIT & PREVIEW</p>
              <h2>編輯預覽</h2>
            </div>
            <span class="badge" id="draftState">尚未產生</span>
          </div>

          <div class="review-layout">
            <div class="review-editor">
              <div class="field">
                <label for="facebookText" class="field-label">Facebook 文案</label>
                <textarea id="facebookText" rows="7" placeholder="AI 產生後會自動填入"></textarea>
              </div>
              <div class="field">
                <label for="reelText" class="field-label">Reel 短影音文案</label>
                <textarea id="reelText" rows="4" placeholder="短影音用的描述文字"></textarea>
              </div>
              <div class="field">
                <label for="hashtagsText" class="field-label">Hashtag</label>
                <input id="hashtagsText" type="text" value="#神像彩繪 #宮廟藝術 #傳統工藝 #台灣信仰" />
              </div>
              <div class="action-row">
                <button class="btn-secondary" id="saveButton" type="button" disabled>💾 儲存草稿</button>
                <button class="btn-dark" id="scheduleButton" type="button" disabled>📅 排程發布</button>
              </div>
              <p class="form-hint" id="previewMessage"></p>
            </div>

            <div class="review-preview">
              <div class="field">
                <span class="field-label">預覽平台切換</span>
                <div id="previewPlatformTabs" class="platform-tabs" role="tablist"></div>
              </div>
              <p id="previewPlatformStatus" class="platform-status"></p>
              <div class="preview-image-wrap empty" id="previewImageWrap">
                <div class="preview-empty">
                  <span>🖼️</span>
                  <p>媒體預覽</p>
                </div>
                <div id="previewMediaGallery" class="media-gallery preview-media-gallery" aria-label="作品預覽"></div>
              </div>
              <article class="copy-card">
                <h4>貼文預覽</h4>
                <div id="facebookPreview" class="copy-text">尚未產生文案</div>
                <p id="hashtagsPreview" class="hashtags"></p>
              </article>
            </div>
          </div>
        </section>

        <!-- ========== 設定 ========== -->
        <form class="panel is-hidden" id="settingsForm" data-view-panel="settings">
          <div class="panel-heading">
            <div>
              <p class="section-tag">SETTINGS</p>
              <h2>系統設定</h2>
            </div>
          </div>

          <fieldset class="form-group-card">
            <legend class="group-title">🤖 Gemini AI 設定</legend>
            <div class="field">
              <div class="field-label-group">
                <label for="settingGeminiApiKey" class="field-label">API Key <span class="field-required">*</span></label>
                <a class="field-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">免費取得 Key →</a>
              </div>
              <div class="input-action">
                <input id="settingGeminiApiKey" type="password" placeholder="AIzaSy..." />
                <button type="button" id="toggleGeminiKey" class="btn-icon">顯示</button>
              </div>
            </div>

            <details class="disclosure compact">
              <summary><span>模型設定</span><span class="chevron">›</span></summary>
              <div class="disclosure-body">
                <div class="field-row">
                  <div class="field"><label for="settingGeminiModel" class="field-label">主要模型</label><input id="settingGeminiModel" type="text" placeholder="gemini-3.6-flash" /></div>
                  <div class="field"><label for="settingGeminiFallbackModels" class="field-label">備援模型</label><input id="settingGeminiFallbackModels" type="text" placeholder="gemini-2.5-flash" /></div>
                </div>
              </div>
            </details>

            <div class="action-box">
              <button type="button" id="btnTestGemini" class="btn-test">🧪 測試 Gemini 連線</button>
              <span id="testGeminiResult" class="test-result"></span>
            </div>
          </fieldset>

          <fieldset class="form-group-card">
            <legend class="group-title">📘 Facebook 發布設定 <span class="field-optional">(選填)</span></legend>
            <div class="field">
              <label for="settingFacebookPageId" class="field-label">粉專 ID</label>
              <input id="settingFacebookPageId" type="text" placeholder="100088888888" />
            </div>

            <div class="field">
              <div class="field-label-group">
                <label for="settingFacebookPageAccessToken" class="field-label">Page Access Token</label>
                <a class="field-link" href="https://developers.facebook.com/tools/explorer/" target="_blank" rel="noopener">開發者憑證 →</a>
              </div>
              <div class="input-action">
                <input id="settingFacebookPageAccessToken" type="password" placeholder="EAA..." />
                <button type="button" id="toggleFbToken" class="btn-icon">顯示</button>
              </div>
            </div>

            <details class="disclosure compact">
              <summary><span>API 設定</span><span class="chevron">›</span></summary>
              <div class="disclosure-body">
                <div class="field"><label for="settingMetaGraphVersion" class="field-label">Graph API 版本</label><input id="settingMetaGraphVersion" type="text" placeholder="v25.0" /></div>
              </div>
            </details>

            <div class="action-box">
              <button type="button" id="btnTestFacebook" class="btn-test">🧪 測試 Facebook 連線</button>
              <span id="testFacebookResult" class="test-result"></span>
            </div>
          </fieldset>

          <button class="primary-button" type="submit" id="saveSettingsBtn">💾 儲存設定</button>
        </form>
      </section>

      <section class="bottom-grid">
        <!-- 草稿 -->
        <section class="panel is-hidden" data-view-panel="drafts">
          <div class="panel-heading compact">
            <div>
              <p class="section-tag">DRAFTS</p>
              <h3>草稿</h3>
            </div>
            <button class="btn-text" id="refreshButton" type="button">↻ 重新整理</button>
          </div>
          <div id="postsList" class="list-empty">
            <div class="empty-state">
              <span class="empty-icon">📝</span>
              <p>還沒有草稿</p>
            </div>
          </div>
        </section>

        <!-- 排程 -->
        <section class="panel is-hidden" data-view-panel="schedule">
          <div class="panel-heading compact">
            <div>
              <p class="section-tag">SCHEDULE</p>
              <h3>排程</h3>
            </div>
          </div>
          <div id="scheduleList" class="list-empty">
            <div class="empty-state">
              <span class="empty-icon">📅</span>
              <p>還沒有排程</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <dialog id="scheduleDialog" class="schedule-dialog">
      <form method="dialog" id="scheduleForm">
        <button class="close-button" value="cancel" aria-label="關閉">×</button>
        <p class="section-tag">PUBLISH</p>
        <h3>排程發布</h3>
        <div class="field"><label for="scheduleChannel" class="field-label">平台</label>
          <select id="scheduleChannel">
            <option value="facebook">Facebook</option>
            <option value="instagram" disabled>Instagram（即將支援）</option>
            <option value="threads" disabled>Threads（即將支援）</option>
            <option value="line" disabled>LINE VOOM（即將支援）</option>
          </select>
        </div>
        <div class="field"><label for="scheduleAccount" class="field-label">帳號</label>
          <select id="scheduleAccount">
            <option value="facebook:default">預設帳號</option>
          </select>
        </div>
        <div class="field"><label for="scheduleContentType" class="field-label">格式</label>
          <select id="scheduleContentType">
            <option value="post">貼文</option>
          </select>
        </div>
        <div id="scheduleContentSettings" class="content-settings"></div>
        <div class="field"><label for="scheduledAt" class="field-label">發布時間</label><input id="scheduledAt" type="datetime-local" required /></div>
        <button class="primary-button" id="scheduleSubmitButton" value="default" type="submit">確認排程</button>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script src="/app.js?v=20260813-15" type="module"></script>
  </body>
</html>
