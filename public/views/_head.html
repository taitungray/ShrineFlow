<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141211" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShrineFlow" />
    <meta name="screen-orientation" content="portrait" />
    <title>ShrineFlow · Social Publishing Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { background-color: #f7f1eb; }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #141211; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #141211; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #f7f1eb; }
      html.is-booting *, html.is-resuming * { transition: none !important; animation: none !important; }
      html:not(.has-session) body.auth-required > :not(#authGate):not(.nav-sprite):not(#portraitLock) { display: none !important; }
      html.has-session #authGate { display: none !important; }
      .is-hidden { display: none !important; }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('is-booting');
        var theme = null;
        try { theme = localStorage.getItem('shrineflow.theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
        try { localStorage.setItem('shrineflow.theme', theme); } catch (e) {}
        try {
          if (localStorage.getItem('shrineflow.signedIn') === '1') root.classList.add('has-session');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css?v=0.6.107" />
  </head>
  <body class="auth-required">
    <script>
      (function () {
        try {
          if (localStorage.getItem('shrineflow.signedIn') === '1') {
            document.body.classList.remove('auth-required');
          }
        } catch (e) {}
      })();
    </script>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <section class="auth-gate" id="authGate" aria-labelledby="authTitle" aria-busy="true">
      <div class="auth-card">
        <p class="section-tag">SHRINEFLOW <span class="version-tag" id="authAppVersion">v0.6.107</span></p>
        <h1 id="authTitle">登入工作台</h1>
        <p class="panel-lede" id="authDescription">正在確認登入狀態…</p>
        <button class="primary-button auth-google-button is-hidden" id="authGoogleButton" type="button"><span aria-hidden="true">G</span> 使用 Google 帳號登入</button>
        <form class="is-hidden" id="authForm">
          <div class="field">
            <label for="authPassword" class="field-label">操作員密碼</label>
            <input id="authPassword" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="primary-button" type="submit">登入工作台</button>
        </form>
        <p class="helper text-danger" id="authMessage" aria-live="polite"></p>
      </div>
    </section>
